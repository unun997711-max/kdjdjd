
name: Build LIVAI Shadows of Hell APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build LIVAI Android Game
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Download Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64
          sudo mv godot-bin/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -r /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Create LIVAI game project
        shell: bash
        run: |
          mkdir -p scenes scripts assets build

          cat > project.godot <<'EOF'
          config_version=5

          [application]
          config/name="LIVAI: Shadows of Hell"
          run/main_scene="res://scenes/main.tscn"
          config/description="A pixel art dark fantasy action game."
          config/features=PackedStringArray("4.4", "GL Compatibility")

          [display]
          window/size/viewport_width=960
          window/size/viewport_height=540
          window/size/window_width_override=1280
          window/size/window_height_override=720
          window/stretch/mode="canvas_items"
          window/handheld/orientation=1

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/default_filters/use_nearest_mipmap_filter=false
          textures/canvas_textures/default_texture_filter=0
          environment/defaults/default_clear_color=Color(0.035, 0.025, 0.055, 1)
          EOF

          cat > scenes/main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://scripts/main.gd" id="1"]

          [node name="LIVAI" type="Node2D"]
          script = ExtResource("1")
          EOF

          cat > scripts/main.gd <<'EOF'
          extends Node2D

          const WORLD_LENGTH := 12000.0
          const FLOOR_Y := 430.0
          const HERO_SPEED := 290.0
          const GRAVITY := 1450.0
          const JUMP_FORCE := -590.0

          var player_x := 180.0
          var player_y := FLOOR_Y
          var velocity_y := 0.0
          var camera_x := 0.0

          var health := 100.0
          var max_health := 100.0
          var energy := 100.0
          var max_energy := 100.0

          var facing := 1
          var attacking := false
          var attack_timer := 0.0
          var attack_cooldown := 0.0
          var attack_hit := false
          var dash_timer := 0.0
          var invulnerable := 0.0
          var hurt_timer := 0.0

          var enemies: Array = []
          var particles: Array = []
          var floating_texts: Array = []
          var projectiles: Array = []

          var score := 0
          var kills := 0
          var stage := 1
          var boss_spawned := false
          var boss_defeated := false
          var game_started := false
          var game_over := false
          var victory := false
          var paused := false

          var left_pressed := false
          var right_pressed := false
          var jump_pressed := false
          var attack_pressed := false
          var dash_pressed := false

          var joystick_origin := Vector2.ZERO
          var joystick_active := false
          var joystick_x := 0.0

          var spawn_timer := 1.0
          var shake := 0.0
          var flash := 0.0
          var elapsed := 0.0
          var rng := RandomNumberGenerator.new()

          var hero_texture: Texture2D
          var enemy_texture: Texture2D
          var demon_texture: Texture2D
          var boss_texture: Texture2D
          var sword_texture: Texture2D
          var flame_texture: Texture2D
          var font: Font

          var stage_names := [
              "THE ASHEN GATE",
              "BLOOD CATHEDRAL",
              "THE FORGOTTEN ABYSS",
              "VALERIAN RUINS",
              "THRONE OF HELL"
          ]

          func _ready() -> void:
              rng.randomize()
              font = ThemeDB.fallback_font
              _create_pixel_art()
              _reset_world()
              set_process(true)
              set_physics_process(true)

          func _create_pixel_art() -> void:
              hero_texture = _make_hero()
              enemy_texture = _make_enemy()
              demon_texture = _make_demon()
              boss_texture = _make_boss()
              sword_texture = _make_sword()
              flame_texture = _make_flame()

          func _pixel(img: Image, x: int, y: int, w: int, h: int, color: Color) -> void:
              for py in range(y, y + h):
                  for px in range(x, x + w):
                      if px >= 0 and py >= 0 and px < img.get_width() and py < img.get_height():
                          img.set_pixel(px, py, color)

          func _make_hero() -> Texture2D:
              var img := Image.create(32, 40, false, Image.FORMAT_RGBA8)
              img.fill(Color.TRANSPARENT)

              var outline := Color("#171321")
              var armor := Color("#9ba9b9")
              var bright := Color("#e1e8f0")
              var dark := Color("#526276")
              var hair := Color("#f3f3ff")
              var shadow := Color("#858da9")
              var red := Color("#9c243b")

              _pixel(img, 9, 2, 14, 9, outline)
              _pixel(img, 7, 5, 16, 7, hair)
              _pixel(img, 6, 8, 4, 7, hair)
              _pixel(img, 21, 7, 4, 8, shadow)
              _pixel(img, 10, 10, 12, 8, Color("#d9b5a3"))
              _pixel(img, 10, 13, 3, 2, outline)
              _pixel(img, 19, 13, 3, 2, outline)
              _pixel(img, 13, 17, 8, 2, outline)
              _pixel(img, 8, 18, 17, 12, outline)
              _pixel(img, 9, 19, 15, 9, armor)
              _pixel(img, 11, 20, 4, 7, bright)
              _pixel(img, 17, 20, 5, 7, dark)
              _pixel(img, 14, 22, 5, 5, red)
              _pixel(img, 5, 19, 5, 12, outline)
              _pixel(img, 4, 21, 5, 8, armor)
              _pixel(img, 24, 19, 5, 12, outline)
              _pixel(img, 24, 21, 5, 8, dark)
              _pixel(img, 9, 29, 15, 3, outline)
              _pixel(img, 10, 30, 5, 8, dark)
              _pixel(img, 18, 30, 5, 8, armor)
              _pixel(img, 8, 37, 8, 3, outline)
              _pixel(img, 17, 37, 8, 3, outline)
              _pixel(img, 11, 4, 10, 2, bright)
              _pixel(img, 7, 9, 4, 3, Color("#b5c7ff"))
              return ImageTexture.create_from_image(img)

          func _make_enemy() -> Texture2D:
              var img := Image.create(28, 32, false, Image.FORMAT_RGBA8)
              img.fill(Color.TRANSPARENT)
              var o := Color("#160d20")
              _pixel(img, 7, 4, 15, 8, o)
              _pixel(img, 5, 9, 19, 15, o)
              _pixel(img, 7, 10, 15, 12, Color("#753047"))
              _pixel(img, 8, 5, 4, 5, Color("#d8b8a5"))
              _pixel(img, 17, 5, 4, 5, Color("#d8b8a5"))
              _pixel(img, 8, 12, 4, 3, Color("#ffcf55"))
              _pixel(img, 17, 12, 4, 3, Color("#ffcf55"))
              _pixel(img, 9, 18, 10, 4, Color("#3a192f"))
              _pixel(img, 6, 22, 6, 8, o)
              _pixel(img, 17, 22, 6, 8, o)
              _pixel(img, 3, 13, 5, 9, o)
              _pixel(img, 21, 13, 5, 9, o)
              return ImageTexture.create_from_image(img)

          func _make_demon() -> Texture2D:
              var img := Image.create(36, 40, false, Image.FORMAT_RGBA8)
              img.fill(Color.TRANSPARENT)
              var o := Color("#170b1b")
              _pixel(img, 7, 3, 8, 10, o)
              _pixel(img, 21, 3, 8, 10, o)
              _pixel(img, 9, 7, 18, 12, o)
              _pixel(img, 7, 14, 22, 17, o)
              _pixel(img, 9, 15, 18, 13, Color("#b43c38"))
              _pixel(img, 11, 10, 5, 5, Color("#ffca58"))
              _pixel(img, 21, 10, 5, 5, Color("#ffca58"))
              _pixel(img, 14, 18, 8, 3, o)
              _pixel(img, 8, 29, 8, 9, o)
              _pixel(img, 21, 29, 8, 9, o)
              _pixel(img, 4, 16, 5, 12, o)
              _pixel(img, 27, 16, 5, 12, o)
              return ImageTexture.create_from_image(img)

          func _make_boss() -> Texture2D:
              var img := Image.create(64, 68, false, Image.FORMAT_RGBA8)
              img.fill(Color.TRANSPARENT)
              var o := Color("#100b1c")
              _pixel(img, 5, 4, 16, 20, o)
              _pixel(img, 43, 4, 16, 20, o)
              _pixel(img, 12, 12, 40, 30, o)
              _pixel(img, 9, 28, 46, 28, o)
              _pixel(img, 12, 30, 40, 23, Color("#65233f"))
              _pixel(img, 17, 20, 9, 8, Color("#ffca4b"))
              _pixel(img, 38, 20, 9, 8, Color("#ffca4b"))
              _pixel(img, 25, 34, 14, 7, o)
              _pixel(img, 14, 52, 13, 13, o)
              _pixel(img, 38, 52, 13, 13, o)
              _pixel(img, 3, 32, 9, 16, o)
              _pixel(img, 52, 32, 9, 16, o)
              _pixel(img, 25, 42, 14, 9, Color("#b88b49"))
              return ImageTexture.create_from_image(img)

          func _make_sword() -> Texture2D:
              var img := Image.create(32, 32, false, Image.FORMAT_RGBA8)
              img.fill(Color.TRANSPARENT)
              _pixel(img, 15, 1, 4, 22, Color("#f2f5ff"))
              _pixel(img, 14, 4, 6, 15, Color("#9bd8ff"))
              _pixel(img, 13, 19, 8, 3, Color("#d4a64d"))
              _pixel(img, 15, 22, 4, 8, Color("#713e32"))
              _pixel(img, 12, 28, 10, 3, Color("#d4a64d"))
              return ImageTexture.create_from_image(img)

          func _make_flame() -> Texture2D:
              var img := Image.create(16, 20, false, Image.FORMAT_RGBA8)
              img.fill(Color.TRANSPARENT)
              _pixel(img, 5, 1, 7, 6, Color("#ffdf69"))
              _pixel(img, 3, 6, 11, 9, Color("#ff843e"))
              _pixel(img, 5, 11, 7, 7, Color("#e53c48"))
              _pixel(img, 7, 7, 3, 8, Color("#fff0a1"))
              return ImageTexture.create_from_image(img)

          func _reset_world() -> void:
              player_x = 180.0
              player_y = FLOOR_Y
              velocity_y = 0.0
              health = max_health
              energy = max_energy
              score = 0
              kills = 0
              stage = 1
              enemies.clear()
              particles.clear()
              floating_texts.clear()
              projectiles.clear()
              boss_spawned = false
              boss_defeated = false
              game_over = false
              victory = false
              paused = false
              game_started = false
              spawn_timer = 1.0
              elapsed = 0.0
              _spawn_enemy(650.0)
              _spawn_enemy(1000.0)

          func _process(delta: float) -> void:
              elapsed += delta
              if shake > 0.0:
                  shake = maxf(0.0, shake - delta * 22.0)
              if flash > 0.0:
                  flash = maxf(0.0, flash - delta * 2.5)
              queue_redraw()

          func _physics_process(delta: float) -> void:
              if not game_started or game_over or victory or paused:
                  return

              attack_cooldown = maxf(0.0, attack_cooldown - delta)
              invulnerable = maxf(0.0, invulnerable - delta)
              hurt_timer = maxf(0.0, hurt_timer - delta)
              dash_timer = maxf(0.0, dash_timer - delta)

              var direction := 0.0
              if left_pressed or Input.is_key_pressed(KEY_A) or Input.is_key_pressed(KEY_LEFT):
                  direction -= 1.0
              if right_pressed or Input.is_key_pressed(KEY_D) or Input.is_key_pressed(KEY_RIGHT):
                  direction += 1.0
              direction += joystick_x
              direction = clampf(direction, -1.0, 1.0)

              if direction != 0.0:
                  facing = 1 if direction > 0.0 else -1

              var speed := HERO_SPEED
              if dash_timer > 0.0:
                  speed = 760.0
              player_x += direction * speed * delta
              player_x = clampf(player_x, 35.0, WORLD_LENGTH - 70.0)

              var jumping := jump_pressed or Input.is_key_pressed(KEY_SPACE) or Input.is_key_pressed(KEY_W) or Input.is_key_pressed(KEY_UP)
              if jumping and is_on_floor():
                  velocity_y = JUMP_FORCE
                  _burst(Vector2(player_x, player_y - 8), Color("#b9d9ff"), 7)

              velocity_y += GRAVITY * delta
              player_y += velocity_y * delta
              if player_y >= FLOOR_Y:
                  player_y = FLOOR_Y
                  velocity_y = 0.0

              if dash_pressed or Input.is_key_just_pressed(KEY_SHIFT):
                  if energy >= 12.0 and dash_timer <= 0.0:
                      energy -= 12.0
                      dash_timer = 0.22
                      invulnerable = 0.3
                      _burst(Vector2(player_x, player_y - 30), Color("#91cfff"), 12)
                  dash_pressed = false

              if attack_pressed or Input.is_key_pressed(KEY_J) or Input.is_key_pressed(KEY_Z):
                  _attack()
              attack_pressed = false

              if attacking:
                  attack_timer -= delta
                  if attack_timer <= 0.0:
                      attacking = false

              energy = minf(max_energy, energy + delta * 7.0)

              _update_enemies(delta)
              _update_particles(delta)
              _update_projectiles(delta)
              _update_texts(delta)
              _update_spawning(delta)
              _update_stage()

              camera_x = clampf(player_x - 300.0, 0.0, WORLD_LENGTH - 960.0)

              if health <= 0.0:
                  game_over = true

          func is_on_floor() -> bool:
              return player_y >= FLOOR_Y - 0.1

          func _attack() -> void:
              if attack_cooldown > 0.0 or attacking:
                  return
              attacking = true
              attack_timer = 0.24
              attack_cooldown = 0.38
              attack_hit = false
              var damage := 27.0
              if energy >= 30.0 and Input.is_key_pressed(KEY_K):
                  energy -= 30.0
                  damage = 65.0
                  _burst(Vector2(player_x + facing * 65.0, player_y - 35.0), Color("#78cfff"), 22)
              var hit_x := player_x + facing * 75.0
              for enemy in enemies:
                  if not enemy.get("alive", false):
                      continue
                  if absf(enemy["x"] - hit_x) < 95.0 and absf(enemy["y"] - player_y) < 100.0:
                      enemy["hp"] -= damage
                      enemy["flash"] = 0.15
                      enemy["knock"] = facing * 250.0
                      _burst(Vector2(enemy["x"], enemy["y"] - 35.0), Color("#ffb2a0"), 9)
                      shake = 5.0
                      if enemy["hp"] <= 0.0:
                          enemy["alive"] = false
                          kills += 1
                          score += 100 if not enemy.get("boss", false) else 1500
                          _burst(Vector2(enemy["x"], enemy["y"] - 35.0), Color("#ff713e"), 25)
                          _add_text(Vector2(enemy["x"], enemy["y"] - 90), "+100", Color("#ffe48a"))
                          if enemy.get("boss", false):
                              boss_defeated = true
                              score += 5000
                              _add_text(Vector2(enemy["x"], enemy["y"] - 120), "BOSS DEFEATED!", Color("#fff0a0"))
                      attack_hit = true

              _burst(Vector2(player_x + facing * 55.0, player_y - 40.0), Color("#d5edff"), 5)

          func _spawn_enemy(x: float, boss: bool = false) -> void:
              var hp := 95.0 if boss else rng.randf_range(35.0, 65.0)
              enemies.append({
                  "x": x,
                  "y": FLOOR_Y,
                  "hp": hp,
                  "max_hp": hp,
                  "speed": 75.0 if boss else rng.randf_range(55.0, 105.0),
                  "alive": true,
                  "boss": boss,
                  "attack": rng.randf_range(0.5, 1.8),
                  "flash": 0.0,
                  "knock": 0.0,
                  "phase": rng.randf_range(0.0, 6.0)
              })

          func _update_enemies(delta: float) -> void:
              for enemy in enemies:
                  if not enemy["alive"]:
                      continue
                  enemy["flash"] = maxf(0.0, enemy["flash"] - delta)
                  enemy["phase"] += delta * 4.0

                  if absf(enemy["knock"]) > 1.0:
                      enemy["x"] += enemy["knock"] * delta
                      enemy["knock"] = move_toward(enemy["knock"], 0.0, 900.0 * delta)

                  var distance := player_x - enemy["x"]
                  if absf(distance) > 65.0:
                      enemy["x"] += signf(distance) * enemy["speed"] * delta
                  else:
                      enemy["attack"] -= delta
                      if enemy["attack"] <= 0.0:
                          enemy["attack"] = 1.5 if enemy["boss"] else 1.9
                          if invulnerable <= 0.0 and absf(player_y - enemy["y"]) < 80.0:
                              var damage := 17.0 if enemy["boss"] else 9.0
                              health = maxf(0.0, health - damage)
                              invulnerable = 0.65
                              hurt_timer = 0.3
                              shake = 9.0
                              _burst(Vector2(player_x, player_y - 35.0), Color("#ff454f"), 12)
                              _add_text(Vector2(player_x, player_y - 95), "-%d" % int(damage), Color("#ff6666"))

                  enemy["x"] = clampf(enemy["x"], 20.0, WORLD_LENGTH - 20.0)

          func _update_spawning(delta: float) -> void:
              spawn_timer -= delta
              if spawn_timer > 0.0:
                  return
              spawn_timer = rng.randf_range(2.0, 3.5)
              if enemies.size() > 18:
                  return
              if player_x < WORLD_LENGTH - 1100.0:
                  var spawn_x := player_x + rng.randf_range(550.0, 900.0)
                  if spawn_x < WORLD_LENGTH - 200.0:
                      var roll := rng.randf()
                      if roll > 0.72:
                          _spawn_enemy(spawn_x, true if roll > 0.97 and stage >= 3 else false)
                      elif roll > 0.4:
                          _spawn_enemy(spawn_x)
                      else:
                          _spawn_enemy(spawn_x)

          func _update_stage() -> void:
              var new_stage := clampi(int(player_x / 2200.0) + 1, 1, 5)
              if new_stage != stage:
                  stage = new_stage
                  _add_text(Vector2(player_x, 190), stage_names[stage - 1], Color("#ffcf76"))
                  _burst(Vector2(player_x, FLOOR_Y - 20), Color("#c28aff"), 30)

              if player_x >= WORLD_LENGTH - 600.0 and not boss_spawned:
                  boss_spawned = true
                  _spawn_enemy(WORLD_LENGTH - 330.0, true)
                  _add_text(Vector2(player_x, 180), "THE HELL LORD AWAKENS", Color("#ff6868"))

              if boss_defeated and player_x >= WORLD_LENGTH - 120.0:
                  victory = true

          func _burst(position: Vector2, color: Color, amount: int) -> void:
              for i in range(amount):
                  var angle := rng.randf_range(0.0, TAU)
                  var speed := rng.randf_range(45.0, 260.0)
                  particles.append({
                      "x": position.x,
                      "y": position.y,
                      "vx": cos(angle) * speed,
                      "vy": sin(angle) * speed,
                      "life": rng.randf_range(0.2, 0.65),
                      "max": 0.65,
                      "color": color,
                      "size": rng.randi_range(2, 5)
                  })

          func _update_particles(delta: float) -> void:
              for p in particles:
                  p["x"] += p["vx"] * delta
                  p["y"] += p["vy"] * delta
                  p["vy"] += 320.0 * delta
                  p["life"] -= delta
              particles = particles.filter(func(p): return p["life"] > 0.0)

          func _update_projectiles(delta: float) -> void:
              for p in projectiles:
                  p["x"] += p["vx"] * delta
                  p["life"] -= delta
                  if absf(p["x"] - player_x) < 35.0 and invulnerable <= 0.0:
                      health = maxf(0.0, health - p["damage"])
                      invulnerable = 0.5
                      p["life"] = 0.0
                      shake = 6.0
              projectiles = projectiles.filter(func(p): return p["life"] > 0.0)

          func _add_text(pos: Vector2, message: String, color: Color) -> void:
              floating_texts.append({
                  "x": pos.x,
                  "y": pos.y,
                  "message": message,
                  "color": color,
                  "life": 1.1
              })

          func _update_texts(delta: float) -> void:
              for t in floating_texts:
                  t["y"] -= 35.0 * delta
                  t["life"] -= delta
              floating_texts = floating_texts.filter(func(t): return t["life"] > 0.0)

          func _input(event: InputEvent) -> void:
              var size := get_viewport_rect().size

              if event is InputEventKey and event.pressed and not event.echo:
                  if event.keycode == KEY_ESCAPE:
                      if game_started and not game_over and not victory:
                          paused = not paused
                  if event.keycode == KEY_ENTER and not game_started:
                      game_started = true
                  if event.keycode == KEY_ENTER and (game_over or victory):
                      _reset_world()
                      game_started = true

              if event is InputEventScreenTouch:
                  if event.pressed:
                      _handle_touch_down(event.position, size)
                  else:
                      _handle_touch_up(event.position)

              if event is InputEventScreenDrag:
                  if joystick_active:
                      joystick_x = clampf((event.position.x - joystick_origin.x) / 65.0, -1.0, 1.0)

              if event is InputEventMouseButton:
                  if event.pressed:
                      _handle_touch_down(event.position, size)
                  else:
                      _handle_touch_up(event.position)

          func _handle_touch_down(pos: Vector2, size: Vector2) -> void:
              if not game_started:
                  if pos.y > size.y * 0.45:
                      game_started = true
                  return

              if game_over or victory:
                  _reset_world()
                  game_started = true
                  return

              if paused:
                  paused = false
                  return

              if pos.x < size.x * 0.35 and pos.y > size.y * 0.65:
                  joystick_active = true
                  joystick_origin = pos
                  joystick_x = clampf((pos.x - size.x * 0.15) / 65.0, -1.0, 1.0)
                  left_pressed = pos.x < size.x * 0.18
                  right_pressed = pos.x >= size.x * 0.18
              elif pos.x > size.x * 0.78 and pos.y > size.y * 0.62:
                  if pos.x > size.x * 0.91 and pos.y < size.y * 0.84:
                      dash_pressed = true
                  elif pos.y < size.y * 0.83:
                      attack_pressed = true
                  else:
                      jump_pressed = true
              elif pos.y < 65.0 and pos.x > size.x - 80.0:
                  paused = true

          func _handle_touch_up(pos: Vector2) -> void:
              joystick_active = false
              joystick_x = 0.0
              left_pressed = false
              right_pressed = false
              jump_pressed = false

          func _draw() -> void:
              var size := get_viewport_rect().size
              var w := size.x
              var h := size.y
              var offset := Vector2.ZERO
              if shake > 0.0:
                  offset = Vector2(rng.randf_range(-shake, shake), rng.randf_range(-shake, shake))

              draw_rect(Rect2(Vector2.ZERO, size), Color("#100d20"))

              _draw_background(w, h, offset)

              if game_started:
                  _draw_world(offset)
                  _draw_hud(w, h)
                  _draw_mobile_controls(w, h)

              if not game_started:
                  _draw_title(w, h)
              elif paused:
                  _draw_overlay(w, h, "PAUSED", "Tap anywhere to continue")
              elif game_over:
                  _draw_overlay(w, h, "YOU HAVE FALLEN", "Tap to rise again")
              elif victory:
                  _draw_overlay(w, h, "HELL HAS FALLEN", "LIVAI HAS CLAIMED THE THRONE")
              if flash > 0.0:
                  draw_rect(Rect2(Vector2.ZERO, size), Color(1.0, 0.1, 0.12, flash * 0.25))

          func _draw_background(w: float, h: float, offset: Vector2) -> void:
              var sky := Color("#17142b")
              if stage == 2:
                  sky = Color("#251329")
              elif stage == 3:
                  sky = Color("#100d26")
              elif stage >= 4:
                  sky = Color("#2a101e")
              draw_rect(Rect2(Vector2.ZERO, Vector2(w, h)), sky)

              for i in range(34):
                  var sx := fposmod(float(i * 137) - camera_x * 0.08, w)
                  var sy := float((i * 71) % 270)
                  var twinkle := 0.5 + 0.5 * sin(elapsed * 2.0 + float(i))
                  draw_rect(Rect2(Vector2(sx, sy), Vector2(2, 2)), Color(0.9, 0.77, 0.98, twinkle))

              for layer in range(3):
                  var parallax := 0.12 + float(layer) * 0.11
                  var base_y := 315.0 + float(layer) * 37.0
                  var col := Color("#29213c") if layer == 0 else Color("#211a32")
                  if layer == 2:
                      col = Color("#1b172b")
                  for i in range(-2, 12):
                      var bx := float(i * 150) - fposmod(camera_x * parallax, 150.0)
                      var height := float(65 + (i * 47 % 85))
                      draw_rect(Rect2(bx, base_y - height, 100, height), col)
                      draw_rect(Rect2(bx + 20, base_y - height - 18, 12, 20), col)
                      draw_rect(Rect2(bx + 68, base_y - height - 30, 14, 32), col)

              draw_rect(Rect2(0, FLOOR_Y + 2, w, h - FLOOR_Y), Color("#211927"))
              draw_rect(Rect2(0, FLOOR_Y, w, 8), Color("#64506b"))
              draw_rect(Rect2(0, FLOOR_Y + 8, w, 5), Color("#39263d"))

              for i in range(22):
                  var gx := fposmod(float(i * 83) - camera_x, w)
                  draw_rect(Rect2(gx, FLOOR_Y + 25 + float(i % 4) * 18, 25, 3), Color("#4b344a"))

              for i in range(8):
                  var fire_x := fposmod(float(i * 183) - camera_x * 0.8, w)
                  var fire_y := FLOOR_Y - 20.0 - float(i % 3) * 9.0
                  draw_texture_rect(flame_texture, Rect2(fire_x, fire_y, 25, 30), false)

          func _draw_world(offset: Vector2) -> void:
              for enemy in enemies:
                  if not enemy["alive"]:
                      continue
                  var sx := enemy["x"] - camera_x
                  if sx < -120 or sx > 1080:
                      continue
                  var bob := sin(enemy["phase"]) * 3.0
                  var tex: Texture2D = boss_texture if enemy["boss"] else (demon_texture if enemy["max_hp"] > 70.0 else enemy_texture)
                  var dimensions := Vector2(112, 118) if enemy["boss"] else Vector2(70, 80)
                  var pos := Vector2(sx - dimensions.x * 0.5, enemy["y"] - dimensions.y + bob) + offset
                  draw_texture_rect(tex, Rect2(pos, dimensions), false)
                  var bar_w := 100.0 if enemy["boss"] else 50.0
                  var bar_y := pos.y - 13.0
                  draw_rect(Rect2(pos.x + dimensions.x * 0.5 - bar_w * 0.5, bar_y, bar_w, 6), Color("#211521"))
                  draw_rect(Rect2(pos.x + dimensions.x * 0.5 - bar_w * 0.5, bar_y, bar_w * enemy["hp"] / enemy["max_hp"], 6), Color("#ec4854"))

              var hero_pos := Vector2(player_x - camera_x - 48, player_y - 120) + offset
              if invulnerable <= 0.0 or int(elapsed * 16.0) % 2 == 0:
                  draw_texture_rect(hero_texture, Rect2(hero_pos, Vector2(96, 120)), false)

              if attacking:
                  var sword_x := player_x - camera_x + facing * 34.0
                  var sword_y := player_y - 100.0
                  var sword_rect := Rect2(sword_x if facing > 0 else sword_x - 45.0, sword_y, 55, 65)
                  draw_texture_rect(sword_texture, sword_rect, false, Color("#d8f0ff"))

              for p in particles:
                  var alpha := clampf(p["life"] / p["max"], 0.0, 1.0)
                  draw_rect(Rect2(Vector2(p["x"] - camera_x, p["y"]) + offset, Vector2(p["size"], p["size"])), Color(p["color"].r, p["color"].g, p["color"].b, alpha))

              for t in floating_texts:
                  draw_string(font, Vector2(t["x"] - camera_x, t["y"]) + offset, t["message"], HORIZONTAL_ALIGNMENT_CENTER, -1, 18, t["color"])

              for p in projectiles:
                  draw_texture_rect(flame_texture, Rect2(p["x"] - camera_x, p["y"], 30, 35), false)

          func _draw_hud(w: float, h: float) -> void:
              draw_rect(Rect2(18, 16, 265, 78), Color(0.04, 0.035, 0.08, 0.86))
              draw_string(font, Vector2(30, 38), "LIVAI", HORIZONTAL_ALIGNMENT_LEFT, -1, 21, Color("#f4f1ff"))
              draw_string(font, Vector2(30, 60), "VALERIAN KNIGHT", HORIZONTAL_ALIGNMENT_LEFT, -1, 11, Color("#9daacb"))

              draw_rect(Rect2(30, 68, 220, 12), Color("#321d35"))
              draw_rect(Rect2(30, 68, 220.0 * health / max_health, 12), Color("#df3d58"))
              draw_rect(Rect2(30, 84, 220, 7), Color("#18283c"))
              draw_rect(Rect2(30, 84, 220.0 * energy / max_energy, 7), Color("#55b9f4"))

              draw_string(font, Vector2(w - 210, 34), "SCORE  %07d" % score, HORIZONTAL_ALIGNMENT_LEFT, -1, 17, Color("#ffdb8c"))
              draw_string(font, Vector2(w - 210, 58), "KILLS  %03d" % kills, HORIZONTAL_ALIGNMENT_LEFT, -1, 14, Color("#e4d9ef"))
              draw_string(font, Vector2(w - 210, 81), "STAGE  %d / 5" % stage, HORIZONTAL_ALIGNMENT_LEFT, -1, 13, Color("#c7b2e8"))

              var progress := clampf(player_x / WORLD_LENGTH, 0.0, 1.0)
              draw_rect(Rect2(w * 0.34, 20, w * 0.30, 7), Color("#34253d"))
              draw_rect(Rect2(w * 0.34, 20, w * 0.30 * progress, 7), Color("#bd78df"))

              if boss_spawned and not boss_defeated:
                  draw_string(font, Vector2(w * 0.5 - 70, 54), "HELL LORD", HORIZONTAL_ALIGNMENT_CENTER, 140, 15, Color("#ff7070"))

          func _draw_mobile_controls(w: float, h: float) -> void:
              var base_y := h - 88.0
              draw_circle(Vector2(100, base_y), 58, Color(0.12, 0.13, 0.2, 0.55))
              draw_circle(Vector2(100 + joystick_x * 25.0, base_y), 27, Color(0.62, 0.68, 0.86, 0.7))
              draw_string(font, Vector2(76, base_y + 6), "MOVE", HORIZONTAL_ALIGNMENT_CENTER, 48, 11, Color.WHITE)

              _draw_button(Vector2(w - 190, h - 80), 34, "JUMP", Color("#5279ad"))
              _draw_button(Vector2(w - 112, h - 100), 43, "SLASH", Color("#a74358"))
              _draw_button(Vector2(w - 42, h - 80), 30, "DASH", Color("#478eac"))

          func _draw_button(center: Vector2, radius: float, label: String, color: Color) -> void:
              draw_circle(center, radius + 3, Color("#151321"))
              draw_circle(center, radius, Color(color.r, color.g, color.b, 0.72))
              draw_string(font, center + Vector2(-radius, 5), label, HORIZONTAL_ALIGNMENT_CENTER, radius * 2.0, 11, Color.WHITE)

          func _draw_title(w: float, h: float) -> void:
              draw_rect(Rect2(Vector2.ZERO, Vector2(w, h)), Color(0.025, 0.015, 0.05, 0.45))
              draw_texture_rect(boss_texture, Rect2(w * 0.70, h * 0.23, 180, 190), false, Color(1, 1, 1, 0.6))
              draw_texture_rect(hero_texture, Rect2(w * 0.15, h * 0.25, 190, 235), false)
              draw_string(font, Vector2(w * 0.34, h * 0.31), "LIVAI", HORIZONTAL_ALIGNMENT_CENTER, w * 0.42, 56, Color("#f5f0ff"))
              draw_string(font, Vector2(w * 0.34, h * 0.40), "SHADOWS OF HELL", HORIZONTAL_ALIGNMENT_CENTER, w * 0.42, 22, Color("#d47b9d"))
              draw_string(font, Vector2(w * 0.34, h * 0.53), "A VALERIAN KNIGHT'S REVENGE", HORIZONTAL_ALIGNMENT_CENTER, w * 0.42, 13, Color("#bcb3d5"))
              draw_rect(Rect2(w * 0.37, h * 0.66, w * 0.27, 48), Color("#6d263e"))
              draw_string(font, Vector2(w * 0.37, h * 0.66 + 31), "TAP TO BEGIN", HORIZONTAL_ALIGNMENT_CENTER, w * 0.27, 19, Color.WHITE)
              draw_string(font, Vector2(w * 0.25, h * 0.88), "A / D MOVE     SPACE JUMP     J ATTACK     SHIFT DASH", HORIZONTAL_ALIGNMENT_CENTER, w * 0.5, 12, Color("#aaa4bd"))

          func _draw_overlay(w: float, h: float, heading: String, subtitle: String) -> void:
              draw_rect(Rect2(Vector2.ZERO, Vector2(w, h)), Color(0.025, 0.01, 0.04, 0.88))
              var heading_color := Color("#ff777e") if game_over else Color("#f5d58a")
              draw_string(font, Vector2(0, h * 0.40), heading, HORIZONTAL_ALIGNMENT_CENTER, w, 40, heading_color)
              draw_string(font, Vector2(0, h * 0.51), subtitle, HORIZONTAL_ALIGNMENT_CENTER, w, 18, Color("#e6dcef"))
              draw_string(font, Vector2(0, h * 0.66), "SCORE: %d     KILLS: %d" % [score, kills], HORIZONTAL_ALIGNMENT_CENTER, w, 18, Color("#ffdc9b"))
              draw_string(font, Vector2(0, h * 0.79), "TAP OR PRESS ENTER", HORIZONTAL_ALIGNMENT_CENTER, w, 15, Color("#b5a5cb"))
          EOF

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/LIVAI.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk="23"
          gradle_build/target_sdk="35"
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0.0"
          package/unique_name="org.livai.shadowsofhell"
          package/name="LIVAI Shadows of Hell"
          package/signed=true
          screen/immersive_mode=true
          screen/orientation=0
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data/resizeable=true
          permissions/internet=false
          permissions/access_network_state=false
          keystore/debug="debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF

      - name: Create Android debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Import and validate Godot project
        run: |
          mkdir -p build
          godot --headless --editor --path . --import
          godot --headless --path . --editor --quit

      - name: Export Android APK
        run: |
          godot --headless --path . --export-debug "Android" build/LIVAI.apk
          test -s build/LIVAI.apk
          echo "APK created successfully."
          ls -lh build/LIVAI.apk

      - name: Upload LIVAI APK
        uses: actions/upload-artifact@v4
        with:
          name: LIVAI-Shadows-of-Hell-Android
          path: build/LIVAI.apk
          if-no-files-found: error
          retention-days: 30
